# XcodeGen spec. Generates Dvarim.xcodeproj from this file plus the Swift sources,
# so the project is reviewable text in git instead of an opaque bundle.
#   brew install xcodegen && xcodegen generate && open Dvarim.xcodeproj
name: Dvarim
options:
  bundleIdPrefix: moe.ptr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  # Dvarim on the Mac: SwiftUI and AppKit for every screen, and the engine
  # (engine/src) inside it in JavaScriptCore; built by build-native.sh. Built
  # beside the web-view app it replaced as "Dvarim Native", it took over as
  # Dvarim on 2026-10-22 and kept that bundle id and target name, so its copy
  # and settings stayed put.
  DvarimNative:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    scheme:
      configVariants: []
    sources:
      - path: Native
        excludes: ["Engine/**"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Dvarim
        PRODUCT_BUNDLE_IDENTIFIER: moe.ptr.dvarim.native
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Native/Info.plist
      properties:
        CFBundleName: Dvarim
        CFBundleDisplayName: Dvarim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # a server on the tailnet or the local network; 127.0.0.1 needs no asking
        NSLocalNetworkUsageDescription: Dvarim talks to your Dvarim server when it is on your local network or tailnet.
        NSUserNotificationsUsageDescription: Dvarim shows your to-do reminders.
        # this Mac's calendars in Today and Upcoming, in folder mode, once turned on (Calendars.swift)
        NSCalendarsFullAccessUsageDescription: With your to-dos in a folder on this Mac, Dvarim shows your calendars' events in Today and Upcoming.
        # "New To-Do in Dvarim" in every app's Services menu (ServiceProvider)
        NSServices:
          - NSMenuItem:
              default: New To-Do in Dvarim
            NSMessage: newToDo
            NSPortName: Dvarim
            NSSendTypes: [public.utf8-plain-text]
    entitlements:
      path: Native/DvarimNative.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # the hardened runtime's door to EventKit, for this Mac's calendars in folder mode
        com.apple.security.personal-information.calendars: true

