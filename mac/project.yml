# XcodeGen spec. Generates Dvarim.xcodeproj from this file plus the Swift sources,
# so the project is reviewable text in git instead of an opaque bundle.
#   brew install xcodegen && xcodegen generate && open Dvarim.xcodeproj
name: Dvarim
options:
  bundleIdPrefix: moe.ptr
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Dvarim:
    type: application
    platform: macOS
    # a shared scheme, so `xcodebuild -scheme Dvarim` and the Run button agree
    scheme:
      configVariants: []
    sources:
      - path: Dvarim
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Dvarim
        PRODUCT_BUNDLE_IDENTIFIER: moe.ptr.dvarim
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        # Local-only app: signing to run on this Mac is enough.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Dvarim/Info.plist
      properties:
        CFBundleName: Dvarim
        CFBundleDisplayName: Dvarim
        # XcodeGen otherwise writes 1.0 and 1, whatever the settings above say
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # The app talks to the server over plain HTTP on the tailnet. If you put
        # Tailscale Serve in front of it (HTTPS) you can delete this whole block.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSUserNotificationsUsageDescription: Dvarim shows your to-do reminders.
        # the device's calendars in Today and Upcoming, in folder mode (DeviceCalendars.swift)
        NSCalendarsFullAccessUsageDescription: With your to-dos in a folder on this Mac, Dvarim shows your calendars' events in Today and Upcoming.
        # Services menu, on the selection in any app. Give it a key of your own in
        # System Settings → Keyboard → Keyboard Shortcuts → Services.
        NSServices:
          - NSMenuItem:
              default: New To-Do in Dvarim
            NSMessage: newToDo
            NSPortName: Dvarim
            NSSendTypes: [public.utf8-plain-text]
    entitlements:
      path: Dvarim/Dvarim.entitlements
      properties:
        # Sandbox off: the app opens a socket to your own server and registers a
        # global hotkey. Turn it on with com.apple.security.network.client if you
        # ever want to ship it anywhere.
        com.apple.security.app-sandbox: false
        # the hardened runtime's door to EventKit, for the device's calendars in folder mode
        com.apple.security.personal-information.calendars: true

  # Dvarim as a native Mac app: SwiftUI and AppKit for every screen, and the
  # engine (engine/src) inside it in JavaScriptCore. Beside the web-view app
  # until it does everything that one does; built by build-native.sh.
  DvarimNative:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    scheme:
      configVariants: []
    sources:
      - path: Native
        excludes: ["Engine/**"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Dvarim Native
        PRODUCT_BUNDLE_IDENTIFIER: moe.ptr.dvarim.native
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Native/Info.plist
      properties:
        CFBundleName: Dvarim Native
        CFBundleDisplayName: Dvarim Native
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # a server on the tailnet or the local network; 127.0.0.1 needs no asking
        NSLocalNetworkUsageDescription: Dvarim talks to your Dvarim server when it is on your local network or tailnet.
        NSUserNotificationsUsageDescription: Dvarim shows your to-do reminders.
        # this Mac's calendars in Today and Upcoming, in folder mode, once turned on (Calendars.swift)
        NSCalendarsFullAccessUsageDescription: With your to-dos in a folder on this Mac, Dvarim shows your calendars' events in Today and Upcoming.
        # "New To-Do in Dvarim Native" in every app's Services menu (ServiceProvider)
        NSServices:
          - NSMenuItem:
              default: New To-Do in Dvarim Native
            NSMessage: newToDo
            NSPortName: Dvarim Native
            NSSendTypes: [public.utf8-plain-text]
    entitlements:
      path: Native/DvarimNative.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # the hardened runtime's door to EventKit, for this Mac's calendars in folder mode
        com.apple.security.personal-information.calendars: true

